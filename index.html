<script>window.STUDY={"id": "BAC-classes-2026", "v": 5, "classes": [["PSV", "Passive", "Only observes or infers; sends nothing into the monitored system.", "nothing (anomaly detection cannot see it)"], ["AML", "Adversarial ML", "Optimised against an ML model: inputs perturbed to change its decision, or training data, labels or updates crafted to corrupt it.", "the model or its learning process"], ["PAY", "Payload", "The content of a single message is crafted, malformed, deceptive or carries foreign content, so the receiver or a user mishandles it.", "valid, typical content for that message type"], ["VOL", "Volume", "The effect comes from the amount, rate, duration or delivery of traffic: too many, too slow, too long or too few. Each message may be valid.", "the expected count, rate or delivery over time"], ["ENM", "Enumeration", "One actor touches abnormally many distinct hosts, ports, credentials, addresses or victims, mostly failing.", "the expected number of distinct values per actor"], ["SPT", "Spoofing & tampering", "A well-formed, plausible message or object asserts something untrue: its sender, route, freshness, reported value, or integrity.", "an independent source of truth the attacker does not control"], ["EBA", "Entity behaviour", "A host, process, device or account acts outside its established behaviour (new peers, external controller, unusual transfers, new privileges or commands, unknown device).", "the entity's own history, its peers, or the asset inventory"]], "anoms": {"A09": ["IoT/OT protocol message flooding", "Flooding devices or brokers with protocol-valid IoT/OT/WSN messages (e.g. MQTT connect/publish, CoAP, Modbus, RPL DIS, Hello flood)."], "A24": ["Fuzzing", "Sending large numbers of random or malformed inputs, messages or identifiers to trigger faults in the receiver (incl. CAN \"fuzzy\" attacks)."], "A32": ["Man-in-the-middle interception", "Inserting oneself into the path between two parties so that their messages are relayed, read or altered while each believes it talks directly to the other."], "A45": ["V2X position / kinematic falsification", "Broadcasting false position, speed or heading in vehicular messages."], "A57": ["Privilege escalation", "Obtaining higher privileges on a host than those granted to the account or process."], "A10": ["CAN bus flooding", "Injecting highest-priority CAN frames (e.g. ID 0x000) continuously so that they win bus arbitration and block other nodes' frames."], "A25": ["SQL injection", "Inserting SQL syntax into application input so that the back-end database executes the attacker's query."], "A33": ["False data injection", "Injecting falsified measurements or state data so that estimation or control acts on a false system state (e.g. power-grid state estimation)."], "A46": ["Energy-consumption falsification", "Manipulating reported meter readings so that recorded consumption differs from actual consumption (energy theft)."], "A58": ["Keylogging / input capture", "Recording a user's keystrokes or input on a host, including through a fake input interface (e.g. a fake screen lock)."], "A11": ["Blackhole (packet dropping)", "A malicious relay node that attracts traffic and drops all packets it should forward."], "A26": ["Cross-site scripting (XSS)", "Injecting client-side script into web content so that other users' browsers execute it."], "A34": ["Replay attack", "Re-sending previously captured valid messages later so that the receiver accepts stale data as current."], "A47": ["Wormhole attack", "Tunnelling packets between two distant colluding nodes so that the network believes they are neighbours, distorting routing."], "A59": ["Rogue device insertion", "Connecting or registering an unauthorised device on a network or control system so that it communicates with legitimate assets."], "A12": ["Grayhole / selective forwarding", "A malicious relay node that drops a selected subset of the packets it should forward."], "A27": ["Malformed-packet attack", "Sending packets that violate the protocol format (e.g. ping of death, teardrop, LAND, malformed MQTT) to crash or confuse the receiver."], "A35": ["ARP spoofing / poisoning", "Sending forged ARP replies that bind the attacker's MAC address to another host's IP address."], "A48": ["Firmware tampering", "Modifying or replacing a device's firmware with unauthorised code."], "A60": ["Covert channel communication", "Hiding communication inside legitimate traffic or data by modulating timing or low-order bits, to carry commands or data unnoticed."], "A13": ["Message delay / suppression", "Deliberately delaying or withholding messages so that they arrive late or not at all."], "A15": ["Password / credential brute forcing", "Repeatedly trying passwords or credential pairs against an authentication service (e.g. SSH, FTP, web login) until one succeeds."], "A28": ["Phishing", "A deceptive message or website that imitates a trusted party to lure a user into revealing credentials or running malicious content."], "A36": ["Data tampering", "Unauthorised modification of data records or messages in storage or transit."], "A49": ["Physical device tampering", "Physically accessing a device or sensor to manipulate it or the data it reports."], "A01": ["SYN flooding", "Sending TCP connection requests (SYN) faster than the target can complete them, exhausting its table of half-open connections."], "A14": ["Jamming", "Emitting radio interference on a channel so that legitimate transmissions cannot be received."], "A16": ["Port scanning", "Probing many ports on one or more hosts to find open services."], "A29": ["Malicious file upload", "Uploading a malicious file (e.g. a web shell or executable) through an application's upload function."], "A37": ["Impersonation / masquerade", "Assuming the identity of a legitimate device, node, ECU or user, e.g. by cloning its identifiers."], "A02": ["HTTP / application-layer flooding", "Sending application requests (e.g. HTTP GET/POST) at high rate to exhaust a server's sue them."], "A61": ["Adversarial evasion examples", "Inputs perturbed at inference time (e.g. FGSM, PGD, C&W) so that an ML model misclassifies them while they remain valid inputs."], "A05": ["Flooding (protocol not specified)", "Volumetric flooding of a target where the source does not state the protocol used."], "A20": ["Vulnerability scanning", "Automated probing of hosts for known vulnerabilities (e.g. with Nessus or SATAN)."], "A41": ["DNS spoofing / cache poisoning", "Supplying forged DNS answers so that names resolve to attacker-chosen addresses."], "A53": ["Data exfiltration", "Transferring data from a compromised system to an attacker-controlled destination."], "A62": ["Training-data poisoning", "Injecting or altering training samples or labels (e.g. label flipping, backdoor triggers) to corrupt what a model learns."], "A06": ["ICMP flooding", "Sending ICMP messages (e.g. echo requests) at high rate to exhaust a target's bandwidth or processing."], "A21": ["Host discovery / ping sweep", "Probing a range of addresses (ICMP, TCP or ARP pings) to find which hosts are live."], "A42": ["Deauthentication / disassociation attack", "Sending forged Wi-Fi management frames, apparently from the access point or client, that disconnect legitimate clients."], "A54": ["Command-and-control communication", "Repeated communication between a compromised host and an external controller to receive commands or report status (incl. beaconing)."], "A63": ["Federated model poisoning", "Malicious federated-learning clients submitting manipulated model updates or gradients to corrupt the global model."], "A07": ["TCP flooding (non-SYN or unspecified flags)", "Sending TCP segments with ACK, PSH-ACK, RST/FIN or unspecified flag combinations at high rate to exhaust a target or middlebox."], "A22": ["Service / version / device scanning", "Probing open services to identify their software versions, banners or device identities (incl. ICS device identification)."], "A43": ["IP address spoofing", "Sending packets with a forged source IP address."], "A55": ["Lateral movement", "Using a compromised internal host, remote services or stolen credentials to gain access to further internal hosts."], "A64": ["Eavesdropping / traffic sniffing", "Passively intercepting and reading communications without sending anything into them."], "A08": ["Reflection / amplification flooding", "Sending requests with the victim's spoofed address to third-party servers (e.g. DNS, NTP, SSDP, memcached), whose larger replies flood the victim."], "A23": ["MAC flooding (CAM-table overflow)", "Sending frames with many forged source MAC addresses until a switch's address table overflows and it forwards traffic to all ports."], "A44": ["Sinkhole / routing manipulation", "Advertising false routes, ranks or versions so that traffic is attracted to, or diverted through, an attacker-chosen node."], "A56": ["Ingress tool transfer", "Downloading attacker tools or payloads onto a compromised host."], "A65": ["Model privacy attacks", "Inferring confidential training data or membership, or reconstructing a model, from its outputs, gradients or updates (membership inference, model inversion, gradient leakage)."]}, "sets": {"S01": ["A09", "A24", "A32", "A45", "A57"], "S02": ["A10", "A25", "A33", "A46", "A58"], "S03": ["A11", "A26", "A34", "A47", "A59"], "S04": ["A12", "A27", "A35", "A48", "A60"], "S05": ["A13", "A15", "A28", "A36", "A49"], "S06": ["A01", "A14", "A16", "A29", "A37"], "S07": ["A02", "A17", "A30", "A38", "A50"], "S08": ["A03", "A18", "A31", "A39", "A51"], "S09": ["A04", "A19", "A40", "A52", "A61"], "S10": ["A05", "A20", "A41", "A53", "A62"], "S11": ["A06", "A21", "A42", "A54", "A63"], "S12": ["A07", "A22", "A43", "A55", "A64"], "S13": ["A08", "A23", "A44", "A56", "A65"]}, "roles": ["SOC / security analyst", "Detection engineer / threat hunter", "Incident responder / DFIR", "Threat intelligence analyst", "Security architect / engineer", "Red team / penetration tester", "OT/ICS or C }
function payload(){
  var p={study:C.id,v:C.v,pid:S.pid,block:S.kind,profile:S.profile,sets:S.sets,
    a:S.ord.map(function(id){ var r=S.ans[id]||{}; return {id:id,c:r.c||null,ms:r.ms||0}; }),t:{start:S.t0,end:Date.now()}};
  if(S.kind==='main') p.comment=S.comment||'';
  return p;
}
function submit(){
  var json=JSON.stringify(payload());
  app.textContent=''; setBar(1); meta('Saving…');
  app.append(el('div',{class:'panel stack'},el('div',{class:'done-big',text:'…'}),el('p',{class:'muted'},'Saving your answers…')));
  function ok(){ S.stage='thanks'; save(); thanks(); }
  function fallback(){ var code='ANOMSTUDY5:'+btoa(unescape(encodeURIComponent(json)));
    app.textContent=''; meta('');
    var ta=el('textarea',{readonly:true,id:'code',style:'min-height:120px;font:11.5px "IBM Plex Mono",monospace'},code);
    app.append(el('div',{class:'panel stack'},el('h2',{},'We could not save automatically'),el('p',{},'Please copy this code and send it to the researcher who invited you.'),ta,
      el('div',{class:'row'},el('button',{class:'btn',type:'button',onclick:function(){ if(navigator.clipboard) navigator.clipboard.writeText(code).catch(function(){ ta.select(); }); else ta.select(); }},'Copy code'),
        el('button',{class:'btn ghost',type:'button',onclick:ok},'Continue'))));
  }
  if(window.google&&google.script&&google.script.run){ google.script.run.withSuccessHandler(ok).withFailureHandler(fallback).submitResponse(json); }
  else if(C.submitUrl&&/^https:/.test(C.submitUrl)){
    fetch(C.submitUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:json}).then(function(r){ return r.text(); })
      .then(function(t){ if(/"ok":true/.test(t)) ok(); else fallback(); }).catch(fallback);
  } else fallback();
}
start();
})();
</script>
