<html lang="en">
<head>

<title>Cybersecurity Anomalies · Expert Study</title>

<style>
:root{--bg:#f3f5f7;--panel:#fff;--panel2:#eef1f4;--ink:#101d2a;--ink2:#46525e;--ink3:#76828d;--rule:#d7dde3;--acc:#1b5c8c;--acc2:#e3eef7;--ok:#1d7a4c;--warn:#a05a00;
--oa:#2a78d6;--lp:#eb6834;--sm:#1baf7a;--na:#8a9199;--oa-bg:#e7eff9;--lp-bg:#fdefe8;--sm-bg:#e3f5ee;--na-bg:#eef0f1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--panel:#171e24;--panel2:#1d252c;--ink:#e8eef3;--ink2:#b4bfc9;--ink3:#8995a0;--rule:#2b3640;--acc:#8ab8df;--acc2:#1c2b39;--ok:#5cc08b;--warn:#e2a54a;
--oa:#3987e5;--lp:#d95926;--sm:#199e70;--na:#8a9199;--oa-bg:#16263a;--lp-bg:#33211a;--sm-bg:#12291f;--na-bg:#22272c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--ink3)}
.bar{flex:1 1 220px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{font:12.5px "IBM Plex Mono",monospace;color:var(--ink3)}
h1{font-size:28px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
h2{font-size:20px;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 10px;max-width:70ch}
.muted{color:var(--ink2)}.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 15px "IBM Plex Sans",sans-serif;border:none;border-radius:8px;padding:11px 18px;background:var(--acc);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.small{font-size:13px;padding:7px 12px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select,input[type=text],textarea{font:14px "IBM Plex Sans",sans-serif;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:90px}
label.f{display:block;font-weight:600;font-size:13.5px;margin:10px 0 4px}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.task{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:6px}
.task:hover{border-color:var(--acc)}
.task .k{font:600 12px "IBM Plex Mono",monospace;color:var(--acc)}
.task b{font-size:17px}
.task.done{opacity:.55}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:none;border-right:1px solid var(--rule);background:var(--panel);color:var(--ink2);padding:7px 12px;font:500 14px "IBM Plex Mono",monospace;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
/* card sort */
.sort{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:14px;align-items:start}
@media (max-width:760px){.sort{grid-template-columns:1fr}}
.pile{position:sticky;top:8px;max-height:calc(100vh - 20px);overflow:auto;background:var(--panel2);border:1px dashed var(--rule);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px}
@media (max-width:760px){.pile{position:static;max-height:none}}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bin{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:110px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s}
.bin.hot{box-shadow:0 0 0 2px var(--acc)}
.bin.over,.pile.over{background:var(--acc2)}
.bin .bh{display:flex;gap:6px;align-items:center}
.bin .bh input{flex:1;min-width:0;font-weight:600}
.bin .cnt{font:12px "IBM Plex Mono",monospace;color:var(--ink3)}
.bin.new{border-style:dashed;align-items:center;justify-content:center;color:var(--acc);cursor:pointer;font-weight:600}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;cursor:grab;user-select:none;font-size:13.5px;line-height:1.35;position:relative}
.card b{display:block}
.card span{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.card.sel{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.bin .card span{display:none}
.bin .card{padding:6px 26px 6px 9px}
.card .x{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--ink3);cursor:pointer;font-size:15px}
.hint{font-size:12.5px;color:var(--ink3)}
/* board */
.focus{background:var(--panel);border:2px solid var(--acc);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.focus .n{font:600 12px "IBM Plex Mono",monospace;color:var(--acc)}
.focus b{display:block;font-size:19px;margin:4px 0}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.board{grid-template-columns:1fr}}
.col{border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px}
.col h3{margin:0;font-size:14px;display:flex;gap:6px;align-items:center}
.col p{font-size:12px;color:var(--ink2);margin:0 0 4px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;color:inherit;font:500 14px "IBM Plex Sans",sans-serif;line-height:1.3}
.tile:hover{border-color:var(--acc)}
.tile .no{font:600 12px "IBM Plex Mono",monospace;color:var(--ink3);margin-right:6px}
.tile .d{display:none;font:400 12px "IBM Plex Sans",sans-serif;color:var(--ink2);margin-top:4px}
.showdef .tile .d{display:block}
.tile.picked{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:760px){.ladder{grid-template-columns:repeat(3,1fr)}}
.lane{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.lane.over{background:var(--acc2)}
.lane .lh{font:600 20px "IBM Plex Mono",monospace;text-align:center}
.lane .la{font-size:11.5px;color:var(--ink2);text-align:center;min-height:30px}
.lane.q .lh{font-size:15px;padding-top:4px}
.chip{background:var(--panel2);border:1px solid var(--rule);border-radius:7px;padding:6px 8px;font-size:12.5px;line-height:1.25;cursor:grab;user-select:none}
.chip.sel{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.tray{display:flex;flex-wrap:wrap;gap:7px;background:var(--panel2);border:1px dashed var(--rule);border-radius:10px;padding:10px;min-height:52px;margin-bottom:10px}
.tray .chip{background:var(--panel)}
.dimhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pill{font:600 12px "IBM Plex Mono",monospace;background:var(--acc2);color:var(--acc);padding:3px 8px;border-radius:20px}
.done-big{font-size:42px;line-height:1}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var sel=null;

// ------- routing
if(!C.task){ try{ var q=new URLSearchParams(location.search).get('t'); if(q&&/^[ABC][1-3]$/.test(q)) C.task=q; }catch(e){} }
function pickSet(type){ var sets=Object.keys(C.sets[type]); return sets[Math.floor(Math.random()*sets.length)]; }
function start(){
  if(!S.consent) return intro();
  if(S.cur) return runTask(S.cur);
  return menu();
}
function intro(){
  setBar(0); meta('');
  var P=S.profile; app.textContent='';
  var roles=C.roles.map(function(r){ return el('option',{value:r,selected:P.role===r},r); });
  var yrs=C.years.map(function(r){ return el('option',{value:r,selected:P.years===r},r); });
  var exp=el('div',{class:'seg',role:'group','aria-label':'Expertise'});
  [1,2,3,4,5].forEach(function(n){ exp.append(el('button',{type:'button','aria-pressed':String(P.expertise===n),onclick:function(){ P.expertise=n; save(); intro(); }},String(n))); });
  var cb=el('input',{type:'checkbox',id:'consent',checked:S.consent});
  var go=el('button',{class:'btn',type:'button',onclick:function(){ if(!cb.checked){ msg.textContent='Please tick the box to continue.'; return; } S.consent=true; S.profile.role=document.getElementById('role').value; S.profile.years=document.getElementById('years').value; save(); var t=(C.task&&C.sets[C.task[0]]&&C.sets[C.task[0]][C.task])?C.task:null; if(t){ S.cur=t; save(); runTask(t);} else menu(); }},'Start');
  var msg=el('p',{class:'warn small',role:'alert'});
  app.append(el('div',{class:'stack'},
    el('h1',{},'Help us test a map of cybersecurity anomalies'),
    el('p',{class:'muted'},'We built a taxonomy of 85 cybersecurity anomalies from 2021–2026 research and industry reports. Your judgement tells us whether it holds up. Each task takes about 10 minutes.'),
    el('div',{class:'panel stack'},
      el('div',{},el('label',{class:'f',for:'role'},'Your main role'),el('select',{id:'role'},el('option',{value:''},'Choose…'),roles)),
      el('div',{},el('label',{class:'f',for:'years'},'Years in security'),el('select',{id:'years'},el('option',{value:''},'Choose…'),yrs)),
      el('div',{},el('label',{class:'f'},'Your expertise in threat and anomaly detection (1 basic, 5 expert)'),exp),
      el('label',{class:'row small',style:'align-items:flex-start;gap:8px;margin-top:6px'},cb,el('span',{},'I am 18 or older and agree to take part. No name, email or IP address is collected; answers are reported only in aggregate and may be shared as an anonymised dataset.')),
      msg, el('div',{},go))));
}
function menu(){
  setBar(0); meta(''); app.textContent='';
  var done=Object.keys(S.done);
  var types=[['A','Sort','Group 24 anomalies your own way','Drag cards into groups you name.'],['B','Map','Place 20 anomalies on our taxonomy','One card at a time, one click each.'],['C','Rate','Rank 7 anomalies by difficulty','Six quick ladders, one per dimension.']];
  app.append(el('div',{class:'stack'},
    el('h1',{},done.length?'Thank you! Another 10 minutes?':'Choose a task'),
    done.length?el('p',{class:'muted'},'Your answers are saved. Pick another task, or simply close this page.'):el('p',{class:'muted'},'Each task takes about 10 minutes. If you plan to do both Sort and Map, please do Sort first.'),
    el('div',{class:'tasks'},types.map(function(t){ var did=done.some(function(d){ return d[0]===t[0]; });
      return el('button',{class:'task'+(did?' done':''),type:'button',onclick:function(){ var s=pickSet(t[0]); S.cur=s; save(); runTask(s); }},el('span',{class:'k'},t[1].toUpperCase()+' · ~10 MIN'+(did?' · DONE':'')),el('b',{},t[2]),el('span',{class:'small muted'},t[3])); }))));
}
function runTask(t){ var w=S.work[t]=S.work[t]||{start:Date.now()}; save(); ({A:taskA,B:taskB,C:taskC})[t[0]](t,w); }

// ------- Task A: open card sort
function taskA(t,w){
  var ids=C.sets.A[t];
  if(!w.bins){ w.bins=[{id:'cannot',n:'Cannot place',c:[]}]; w.pile=shuffle(ids); w.seenB=Object.keys(S.done).some(function(d){ return d[0]==='B'; }); save(); }
  var placed=ids.length-w.pile.length; setBar(placed/ids.length); meta(placed+' / '+ids.length+' sorted');
  app.textContent='';
  function move(id,to){ w.pile=w.pile.filter(function(x){return x!==id;}); w.bins.forEach(function(b){ b.c=b.c.filter(function(x){return x!==id;}); });
    if(to==='pile') w.pile.push(id); else { var b=w.bins.filter(function(b){return b.id===to;})[0]; if(b) b.c.push(id); } sel=null; save(); taskA(t,w); }
  function dz(node,to){ node.addEventListener('dragover',function(e){e.preventDefault(); node.classList.add('over');}); node.addEventListener('dragleave',function(){node.classList.remove('over');});
    node.addEventListener('drop',function(e){e.preventDefault(); var id=e.dataTransfer.getData('text/plain'); if(C.cards[id]) move(id,to);});
    node.addEventListener('click',function(e){ if(sel && !e.target.closest('.card') && e.target.tagName!=='INPUT' && e.target.tagName!=='BUTTON') move(sel,to); }); }
  function cardEl(id,inBin){ var c=card(id); return el('div',{class:'card'+(sel===id?' sel':''),draggable:'true',tabindex:'0',
      ondragstart:function(e){e.dataTransfer.setData('text/plain',id);}, onclick:function(e){ e.stopPropagation(); sel=(sel===id?null:id); taskA(t,w); },
      onkeydown:function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel=(sel===id?null:id); taskA(t,w);} }},
    inBin?el('button',{class:'x',type:'button','aria-label':'Back to the pile',onclick:function(e){ e.stopPropagation(); move(id,'pile'); }},'×'):null, el('b',{title:c[1]},c[0]), el('span',{},c[1])); }
  var pile=el('div',{class:'pile','aria-label':'Cards to sort'},el('div',{class:'hint'},w.pile.length?('To sort ('+w.pile.length+') · drag a card, or tap it then tap a group'):'All cards sorted'), w.pile.map(function(id){ return cardEl(id,false); }));
  dz(pile,'pile');
  var bins=el('div',{class:'bins'});
  w.bins.forEach(function(b){ var box=el('div',{class:'bin'+(sel?' hot':'')},
      el('div',{class:'bh'}, b.id==='cannot'?el('b',{class:'small'},'Cannot place'):el('input',{type:'text',value:b.n||'',placeholder:'Name this group','aria-label':'Group name',oninput:function(e){ b.n=e.target.value; save(); }}),
        el('span',{class:'cnt'},String(b.c.length)),
        b.id!=='cannot'?el('button',{class:'x',type:'button',style:'position:static','aria-label':'Delete group',onclick:function(){ w.pile=w.pile.concat(b.c); w.bins=w.bins.filter(function(x){return x!==b;}); save(); taskA(t,w); }},'×'):null),
      b.c.map(function(id){ return cardEl(id,true); })); dz(box,b.id); bins.append(box); });
  var nb=el('div',{class:'bin new',tabindex:'0',role:'button',onclick:function(){ var b={id:'g'+Date.now().toString(36),n:'',c:[]}; w.bins.splice(w.bins.filter(function(x){return x.id!=='cannot';}).length,0,b); if(sel){ move(sel,b.id); } else { save(); taskA(t,w);} }},sel?'+ New group with the selected card':'+ New group');
  bins.append(nb);
  var named=w.bins.filter(function(b){return b.id!=='cannot'&&b.c.length;});
  var ready=!w.pile.length && named.length>=2 && named.every(function(b){return (b.n||'').trim();});
  app.append(el('div',{class:'stack'},
    el('div',{},el('h2',{},'Sort: group these anomalies your way'),
      el('p',{class:'muted small'},'Put anomalies together if you would detect or defend against them in a similar way. Make as many groups as you like and give each a short name. Use "Cannot place" for any you would not group.')),
    el('div',{class:'sort'},pile,bins),
    el('div',{},el('label',{class:'f',for:'missA'},'Anything important missing from these cards? (optional, one per line)'),el('textarea',{id:'missA',oninput:function(e){ w.missing=e.target.value; save(); }},w.missing||'')),
    el('div',{class:'row'},el('button',{class:'btn',type:'button',disabled:!ready,onclick:function(){ finish(t,w); }},'Submit this task'),
      el('span',{class:'small '+(ready?'ok':'muted')},ready?'Ready to submit.':'Sort every card, make at least two groups, and name each group.'))));
}

// ------- Task B: taxonomy board, one card at a time
function taskB(t,w){
  var ids=C.sets.B[t];
  if(!w.order){ w.order=shuffle(ids); w.i=0; w.place={}; save(); }
  app.textContent='';
  if(w.i>=w.order.length) return taskBend(t,w);
  setBar(w.i/w.order.length); meta((w.i+1)+' / '+w.order.length);
  var id=w.order[w.i], c=card(id), cur=w.place[id]||{};
  function pick(r,m){ w.place[id]={r:r,m:m}; w.i++; save(); taskB(t,w); }
  var board=el('div',{class:'board'+(w.showdef?' showdef':'')});
  C.regimes.forEach(function(rg){ var r=rg[0];
    var col=el('div',{class:'col',style:'background:var(--'+r.toLowerCase()+'-bg)'},el('h3',{},el('span',{class:'sw',style:'background:var(--'+r.toLowerCase()+')'}),r+' · '+rg[1]),el('p',{},C.one[r]));
    C.board[r].forEach(function(m){ col.append(el('button',{type:'button',class:'tile'+(cur.r===r&&cur.m===m?' picked':''),onclick:function(){ pick(r,m); }},el('span',{class:'no'},m.slice(-2)),C.short[m],el('span',{class:'d'},C.macdef[m]))); });
    col.append(el('button',{type:'button',class:'tile',style:'font-weight:400;color:var(--ink2)',onclick:function(){ pick(r,'none'); }},'Fits here, but no class fits'));
    board.append(col); });
  app.append(el('div',{class:'stack'},
    el('div',{},el('h2',{},'Map: where does each anomaly belong in our taxonomy?'),el('p',{class:'muted small'},'Columns are Level 1 (how the anomaly relates to legitimate activity). Tiles are the 12 Level 2 classes; some appear in two columns. Click the tile that fits best.')),
    el('div',{class:'focus'},el('span',{class:'n'},'ANOMALY '+(w.i+1)+' OF '+w.order.length),el('b',{},c[0]),el('span',{class:'muted'},c[1])),
    board,
    el('div',{class:'row'},
      el('button',{class:'btn ghost small',type:'button',disabled:w.i===0,onclick:function(){ w.i--; save(); taskB(t,w); }},'← Back'),
      el('button',{class:'btn ghost small',type:'button',onclick:function(){ pick('none','none'); }},'Nothing fits'),
      el('button',{class:'btn ghost small',type:'button',onclick:function(){ w.showdef=!w.showdef; save(); taskB(t,w); }},w.showdef?'Hide class descriptions':'Show class descriptions'))));
}
function taskBend(t,w){
  setBar(1); meta('Almost done');
  w.evalq=w.evalq||{};
  function lik(k,q){ var s=el('div',{class:'seg',role:'group','aria-label':q}); [1,2,3,4,5].forEach(function(n){ s.append(el('button',{type:'button','aria-pressed':String(w.evalq[k]===n),onclick:function(){ w.evalq[k]=n; save(); taskBend(t,w); }},String(n))); });
    return el('div',{},el('div',{class:'small',style:'margin-bottom:4px'},q),s); }
  app.textContent='';
  app.append(el('div',{class:'stack'},el('h2',{},'Three quick questions'),el('p',{class:'small muted'},'1 = strongly disagree, 5 = strongly agree'),
    el('div',{class:'panel stack'},lik('clear','The structure is clear and easy to apply.'),lik('useful','It would help prioritise detection and defence work.'),lik('better','It adds something MITRE ATT&CK tactics alone do not.'),
      el('div',{},el('label',{class:'f',for:'missB'},'Important anomaly types it does not cover (optional, one per line)'),el('textarea',{id:'missB',oninput:function(e){ w.missing=e.target.value; save(); }},w.missing||''))),
    el('div',{class:'row'},el('button',{class:'btn ghost',type:'button',onclick:function(){ w.i=w.order.length-1; save(); taskB(t,w); }},'← Back'),el('button',{class:'btn',type:'button',onclick:function(){ finish(t,w); }},'Submit this task'))));
}

// ------- Task C: difficulty ladders, one dimension at a time
function taskC(t,w){
  var ids=C.sets.C[t];
  if(!w.rate){ w.rate={}; w.d=0; w.order=shuffle(ids); save(); }
  app.textContent='';
  if(w.d>=C.dims.length) return finish(t,w);
  var D=C.dims[w.d], k=D[0];
  setBar(w.d/C.dims.length); meta('Ladder '+(w.d+1)+' / '+C.dims.length);
  function val(id){ var r=w.rate[id]; return r&&r[k]!==undefined?r[k]:null; }
  function put(id,v){ w.rate[id]=w.rate[id]||{}; if(v===null) delete w.rate[id][k]; else w.rate[id][k]=v; sel=null; save(); taskC(t,w); }
  function chip(id){ return el('div',{class:'chip'+(sel===id?' sel':''),draggable:'true',tabindex:'0',title:card(id)[1],
      ondragstart:function(e){ e.dataTransfer.setData('text/plain',id); }, onclick:function(e){ e.stopPropagation(); sel=(sel===id?null:id); taskC(t,w); },
      onkeydown:function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel=(sel===id?null:id); taskC(t,w);} }}, card(id)[0]); }
  function zone(node,v){ node.addEventListener('dragover',function(e){e.preventDefault(); node.classList.add('over');}); node.addEventListener('dragleave',function(){node.classList.remove('over');});
    node.addEventListener('drop',function(e){ e.preventDefault(); var id=e.dataTransfer.getData('text/plain'); if(C.cards[id]) put(id,v); });
    node.addEventListener('click',function(e){ if(sel && !e.target.closest('.chip')) put(sel,v); }); }
  var unr=w.order.filter(function(id){ return val(id)===null; });
  var tray=el('div',{class:'tray','aria-label':'Anomalies to place'}, unr.length?unr.map(chip):el('span',{class:'hint'},'All placed. You can still move them.'));
  zone(tray,null);
  var lad=el('div',{class:'ladder'});
  [0,1,2,3,4,-1].forEach(function(v){ var ln=el('div',{class:'lane'+(v<0?' q':'')},el('div',{class:'lh'},v<0?'Can’t judge':String(v)),el('div',{class:'la'},v<0?'':(v===0?D[3][0]:v===2?D[3][2]:v===4?D[3][4]:'')),
      w.order.filter(function(id){ return val(id)===v; }).map(chip)); zone(ln,v); lad.append(ln); });
  app.append(el('div',{class:'stack'},
    el('div',{class:'dimhead'},el('h2',{},D[1]+': '+D[2]),el('span',{class:'pill'},'0 = easy for the defender · 4 = very hard')),
    el('p',{class:'small muted'},'Drag each anomaly onto the ladder, or tap it and then tap a step. Compare them with each other. Assume: '+C.env),
    tray, lad,
    el('div',{class:'row'},el('button',{class:'btn ghost',type:'button',disabled:w.d===0,onclick:function(){ w.d--; save(); taskC(t,w); }},'← Previous'),
      el('button',{class:'btn',type:'button',disabled:unr.length>0,onclick:function(){ w.d++; save(); taskC(t,w); }},w.d===C.dims.length-1?'Submit this task':'Next ladder →'),
      unr.length?el('span',{class:'small muted'},unr.length+' left to place'):null)));
}

// ------- submit
function payload(t,w){
  var p={study:C.id,v:3,pid:S.pid,task:t,profile:S.profile,t:{start:w.start,end:Date.now()},missing:w.missing||''};
  if(t[0]==='A'){ p.sort=w.bins.filter(function(b){return b.c.length;}).map(function(b){ return {n:b.id==='cannot'?'__cannot__':b.n,c:b.c}; }); p.seen_taxonomy=w.seenB?'Yes':'No'; }
  if(t[0]==='B'){ p.place=w.place; p.evalq=w.evalq||{}; }
  if(t[0]==='C'){ p.rate=w.rate; }
  return p;
}
function finish(t,w){
  var p=payload(t,w); var json=JSON.stringify(p);
  app.textContent=''; setBar(1); meta('Saving…');
  var status=el('p',{class:'muted'},'Saving your answers…');
  app.append(el('div',{class:'panel stack'},el('div',{class:'done-big',text:'…'}),status));
  function ok(){ S.done[t]=true; S.cur=null; delete S.work[t]; save(); meta(''); menu(); }
  function fallback(){ var code='ANOMSTUDY2:'+btoa(unescape(encodeURIComponent(json)));
    app.textContent=''; meta('');
    var ta=el('textarea',{readonly:true,style:'min-height:120px;font:11.5px "IBM Plex Mono",monospace'},code);
    app.append(el('div',{class:'panel stack'},el('h2',{},'We could not save automatically'),el('p',{},'Please copy this code and send it to the researcher who invited you. Your answers are also kept in this browser.'),ta,
      el('div',{class:'row'},el('button',{class:'btn',type:'button',onclick:function(){ if(navigator.clipboard) navigator.clipboard.writeText(code).catch(function(){ ta.select(); }); else ta.select(); }},'Copy code'),
        el('button',{class:'btn ghost',type:'button',onclick:function(){ S.done[t]=true; S.cur=null; save(); menu(); }},'Continue'))));
  }
  // A server not yet updated to the 1 Oct 2026 study id rejects the new id; retry once with the earlier id
  // (v:3 in the payload still marks the renamed labels), so no answer is lost whatever the deploy order.
  var legacy=json.replace('"study":"LBAT-micro-2026"','"study":"LRAT-micro-2026"');
  if(window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(){
      google.script.run.withSuccessHandler(ok).withFailureHandler(fallback).submitResponse(legacy); }).submitResponse(json);
  } else if(C.submitUrl){
    var post=function(body){ return fetch(C.submitUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).then(function(r){ return r.text(); }); };
    post(json).then(function(t){ if(/"ok":true/.test(t)) return ok();
      return post(legacy).then(function(t2){ if(/"ok":true/.test(t2)) ok(); else fallback(); }); }).catch(fallback);
  } else fallback();
}
start();
})();
</script>
